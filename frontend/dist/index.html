      const stored = localStorage.getItem('ccis_prescriptions');

      localStorage.setItem('ccis_prescriptions', JSON.stringify(INITIAL_PRESCRIPTIONS));

    };

      localStorage.setItem('ccis_prescriptions', JSON.stringify(data));
    };

        partially_dispensed: { label: 'Partially Dispensed', bg: 'bg-blue-50 text-blue-700 border-blue-200', dot: 'bg-blue-500' },
        fulfilled: { label: 'Fulfilled', bg: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500' },
        pending_backorder: { label: 'Pending Backorder', bg: 'bg-purple-50 text-purple-700 border-purple-200', dot: 'bg-purple-500' },
        cancelled: { label: 'Cancelled', bg: 'bg-rose-50 text-rose-700 border-rose-200', dot: 'bg-rose-500' },
        dispensed: { label: 'Dispensed', bg: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500' },
        backordered: { label: 'Backordered', bg: 'bg-purple-50 text-purple-700 border-purple-200', dot: 'bg-purple-500' }
      };

    // --- MAIN APPLICATION COMPONENT ---

      const [prescriptions, setPrescriptions] = useState(loadPrescriptions());
      const [selectedRx, setSelectedRx] = useState(prescriptions[0] || null);

      // Create Form State
      const [selectedCon, setSelectedCon] = useState(CLINICAL_CONSULTATIONS[0]);
      const [diagnosis, setDiagnosis] = useState(CLINICAL_CONSULTATIONS[0].diagnosis);
      const [instructions, setInstructions] = useState('');
      const [items, setItems] = useState([]);
      const [isControlled, setIsControlled] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [feedback, setFeedback] = useState(null);

      // Pharmacist Dispensing Simulation State
      const [dispenseQtyMap, setDispenseQtyMap] = useState({});
      const [dispenseStatusInput, setDispenseStatusInput] = useState('pending');
      const [dispenseNotes, setDispenseNotes] = useState('');

      const updatePrescriptionList = (newList) => {
        setPrescriptions(newList);
        savePrescriptions(newList);
      };

      // Select Consultation handler
      const handleConSelect = (conId) => {
        const found = CLINICAL_CONSULTATIONS.find(c => c.consultationId === conId);
        if (found) {
          setSelectedCon(found);
          setDiagnosis(found.diagnosis);
        }
      };

      // Add medicine from catalogue
      const handleAddMedicine = (med) => {
        if (items.some(i => i.medicineId === med._id)) {
          alert(`'${med.name}' is already added to this prescription.`);
          return;
        }
        if (med.isControlled) setIsControlled(true);
        const newItem = {
          medicineId: med._id,
          medicineName: med.name,
          strength: med.strength,
          form: med.form,
          dosage: med.form === 'Tablet' ? '1 tablet' : med.form === 'Capsule' ? '1 capsule' : '5ml',
          frequency: 'Three times daily (TDS)',
          duration: '5 days',
          quantityPrescribed: 15,
          instructions: 'Take after food'
        };
        setItems([...items, newItem]);
        setIsModalOpen(false);
      };

      // Create prescription submit
      const handleCreatePrescription = (e) => {
        e.preventDefault();
        if (items.length === 0) {
          alert('Prescription must contain at least one medication item.');
          return;
        }
        const newSeq = String(prescriptions.length + 1).padStart(4, '0');
        const newRx = {
          _id: 'rx_' + Date.now(),
          prescriptionNumber: `RX-202611-${newSeq}`,
          patientId: selectedCon.patientId,
          patientName: selectedCon.patientName,
          patientIdentifier: selectedCon.patientIdentifier,
          doctorId: 'doc_001',
          doctorName: 'Dr. John Mensah, MD',
          consultationId: selectedCon.consultationId,
          prescriptionDate: new Date().toISOString(),
          status: 'pending',
          clinicalDiagnosis: diagnosis,
          generalInstructions: instructions,
          isControlledMedication: isControlled,
          items: items.map(it => ({ ...it, quantityDispensed: 0, itemStatus: 'pending' })),
          auditTrail: [{ modifiedAt: new Date().toISOString(), action: 'created', reason: 'Initial prescription created' }],
          dispensingHistory: []
        };
        const updatedList = [newRx, ...prescriptions];
        updatePrescriptionList(updatedList);
        setSelectedRx(newRx);
        setItems([]);
        setInstructions('');
        setTab('handoff');
      };

      // Pharmacist Dispense Update Handler
      const handleDispenseUpdate = (e) => {
        e.preventDefault();
        if (!selectedRx) return;

        // INVIOLABLE INTEGRITY RULE
        if (dispenseStatusInput === 'fulfilled') {
          const incomplete = selectedRx.items.some(item => {
            const entered = dispenseQtyMap[item.medicineId] ?? item.quantityDispensed ?? 0;
            return entered < item.quantityPrescribed;
          });
          if (incomplete) {
            alert('Integrity Violation: Cannot mark prescription as fulfilled when one or more items have not been completely dispensed. Please choose "Partially dispensed" or "Pending backorder".');
            return;
          }
        }

        const updatedRx = {
          ...selectedRx,
          status: dispenseStatusInput,
          items: selectedRx.items.map(item => {
            const qty = dispenseQtyMap[item.medicineId] ?? item.quantityDispensed ?? 0;
            return {
              ...item,
              quantityDispensed: qty,
              itemStatus: qty >= item.quantityPrescribed ? 'dispensed' : qty > 0 ? 'partially_dispensed' : dispenseStatusInput === 'pending_backorder' ? 'backordered' : 'pending'
            };
          }),
          dispensingHistory: [
            ...selectedRx.dispensingHistory,
            {
              dispensedAt: new Date().toISOString(),
              pharmacistName: 'Pharm. Sarah Boateng',
              notes: dispenseNotes || 'Dispensing synchronized from Pharmacy module.'
            }
          ],
          auditTrail: [
            ...selectedRx.auditTrail,
            { modifiedAt: new Date().toISOString(), action: 'dispense_recorded', reason: `Status transitioned to '${dispenseStatusInput}'.` }
          ]
        };

        const updatedList = prescriptions.map(p => p._id === updatedRx._id ? updatedRx : p);
        updatePrescriptionList(updatedList);
        setSelectedRx(updatedRx);
        alert(`Dispensing status updated to '${dispenseStatusInput}'.`);
      };

      // Controlled pre-dispense update
      const handleDoctorUpdate = (reason, newInstructions) => {
        if (!selectedRx || selectedRx.status !== 'pending') {
          alert('Cannot modify prescription: Modifications locked after dispensing begins.');
          return;
        }
        const updatedRx = {
          ...selectedRx,
          generalInstructions: newInstructions,
          auditTrail: [
            ...selectedRx.auditTrail,
            { modifiedAt: new Date().toISOString(), action: 'updated_before_dispense', reason: reason || 'Physician modified instructions' }
          ]
        };
        const updatedList = prescriptions.map(p => p._id === updatedRx._id ? updatedRx : p);
        updatePrescriptionList(updatedList);
        setSelectedRx(updatedRx);
        alert('Prescription instructions updated and audit log saved.');
      };

      // Statistics
      const stats = {
        total: prescriptions.filter(p => p.status !== 'cancelled').length,
        pending: prescriptions.filter(p => p.status === 'pending').length,
        partial: prescriptions.filter(p => p.status === 'partially_dispensed').length,
        fulfilled: prescriptions.filter(p => p.status === 'fulfilled').length,
        backorder: prescriptions.filter(p => p.status === 'pending_backorder').length
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER & SIMULATION ROLE SELECTOR */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40">

              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-teal-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                  Rx
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-base font-bold text-slate-900 leading-tight">
                      CCIS — Prescription Management
                    </h1>
                    <span className="px-2 py-0.5 rounded text-[10px] font-semibold bg-teal-100 text-teal-800 uppercase">
                      Module 3
                    </span>
                  </div>
                  <p className="text-xs text-slate-500">University Clinic Information System</p>
                </div>
              </div>

              {/* Role Toggle Switcher */}
              <div className="flex items-center gap-2 bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs font-medium">
                <span className="px-2 text-slate-500 font-semibold text-[11px]">Active Role:</span>
                <button
                  type="button"
                  onClick={() => setRole('doctor')}
                  className={`px-3 py-1 rounded-md transition-all ${role === 'doctor' ? 'bg-teal-600 text-white font-semibold shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  Doctor (Dr. John)
                </button>
                <button
                  type="button"
                  onClick={() => setRole('pharmacist')}
                  className={`px-3 py-1 rounded-md transition-all ${role === 'pharmacist' ? 'bg-blue-600 text-white font-semibold shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  Pharmacist (Madam Sarah)
                </button>
                <button

                    <tbody className="divide-y divide-slate-100">
                      {prescriptions.map(rx => (
                        <tr key={rx._id} className="hover:bg-slate-50">
                          <td className="px-4 py-3 font-mono font-bold text-teal-800">{rx.prescriptionNumber}</td>
                          <td className="px-4 py-3"><strong>{rx.patientName}</strong> ({rx.patientIdentifier})</td>
                          <td className="px-4 py-3">{rx.doctorName}</td>
                          <td className="px-4 py-3">{new Date(rx.prescriptionDate).toLocaleDateString()}</td>
                          <td className="px-4 py-3 text-slate-600">{rx.items?.map(i => i.medicineName).join(', ')}</td>
                          <td className="px-4 py-3"><Badge status={rx.status} /></td>
                          <td className="px-4 py-3 text-right">
                            <button
                              onClick={() => { setSelectedRx(rx); setTab('details'); }}
                              className="px-2.5 py-1 text-xs border rounded hover:bg-slate-100 font-medium"
                            >
                              Inspect
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* VIEW 6: DISPENSING STATUS TRACKER & PHARMACY RECONCILIATION */}
            {tab === 'status' && selectedRx && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-slate-900">Dispensing Status & Pharmacy Reconciliation</h2>
                  <p className="text-xs text-slate-500">Live synchronization with Module 4 (Pharmacy & Inventory)</p>
                </div>

                {/* Status Stepper Card */}
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-xs space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-slate-900 text-sm">{selectedRx.prescriptionNumber}</h3>
                      <p className="text-xs text-slate-500">{selectedRx.patientName} ({selectedRx.patientIdentifier})</p>
                    </div>
                    <Badge status={selectedRx.status} />
                  </div>

                  {/* Progress Checklist */}
                  <div className="border rounded-lg overflow-hidden text-xs">
                    <table className="w-full text-left">
                      <thead className="bg-slate-50 border-b font-semibold text-slate-600">
                        <tr>
                          <th className="p-3">Medication</th>
                          <th className="p-3">Prescribed</th>
                          <th className="p-3">Dispensed</th>
                          <th className="p-3">Item Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {selectedRx.items?.map((it, idx) => (
                          <tr key={idx}>
                            <td className="p-3 font-bold text-slate-900">{it.medicineName} ({it.strength})</td>
                            <td className="p-3 font-medium">{it.quantityPrescribed} units</td>
                            <td className="p-3 font-bold text-teal-800">{it.quantityDispensed || 0} units</td>
                            <td className="p-3"><Badge status={it.itemStatus || 'pending'} size="sm" /></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Pharmacist Action Simulation Panel */}
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-xs space-y-4">
                  <div className="flex justify-between items-center border-b pb-2">
                    <span className="text-xs font-bold text-blue-800 uppercase">Pharmacy Dispensing Action Interface (Madam Sarah)</span>
                    <span className="text-[11px] text-blue-700 bg-blue-50 px-2 py-0.5 rounded font-semibold">Active: {role === 'pharmacist' ? 'Pharmacist' : 'View Mode'}</span>
                  </div>

                  {role !== 'pharmacist' ? (
                    <div className="p-4 bg-amber-50 border border-amber-200 rounded text-xs text-amber-900">
                      ℹ️ Switch your simulation role to <strong>"Pharmacist (Madam Sarah)"</strong> in the top navbar to record dispensed quantities.
                    </div>
                  ) : (
                    <form onSubmit={handleDispenseUpdate} className="space-y-4 text-xs">
                      <div className="space-y-2">
                        <label className="font-bold text-slate-700 block">Record Dispensed Quantities:</label>
                        {selectedRx.items?.map(it => (
                          <div key={it.medicineId} className="p-3 bg-slate-50 border rounded flex justify-between items-center">
                            <div>
                              <strong className="text-slate-900">{it.medicineName}</strong>
                              <span className="text-slate-500 text-[11px] block">Prescribed: {it.quantityPrescribed} units</span>
                            </div>
                            <div className="flex items-center gap-2">
                              <span>Dispensed Qty:</span>
                              <input
                                type="number"
                                min="0"
                                max={it.quantityPrescribed}
                                defaultValue={it.quantityDispensed || 0}
                                onChange={(e) => setDispenseQtyMap({ ...dispenseQtyMap, [it.medicineId]: parseInt(e.target.value, 10) || 0 })}
                                className="w-20 p-1 border rounded bg-white font-bold text-center"
                              />
                            </div>
                          </div>
                        ))}
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                        <div>
                          <label className="font-bold text-slate-700 block mb-1">Overall Status *</label>
                          <select
                            value={dispenseStatusInput}
                            onChange={(e) => setDispenseStatusInput(e.target.value)}
                            className="w-full p-2 border rounded bg-white text-xs"
                          >
                            <option value="pending">Pending</option>
                            <option value="partially_dispensed">Partially dispensed</option>
                            <option value="fulfilled">Fulfilled</option>
                            <option value="pending_backorder">Pending backorder</option>
                          </select>
                        </div>
                        <div>
                          <label className="font-bold text-slate-700 block mb-1">Pharmacist Notes</label>
                          <input
                            type="text"
                            placeholder="e.g. Amoxicillin dispensed with counseling."
                            value={dispenseNotes}
                            onChange={(e) => setDispenseNotes(e.target.value)}
                            className="w-full p-2 border rounded bg-white text-xs"
                          />
                        </div>
                      </div>

                      <div className="flex justify-end pt-2">
                        <button
                          type="submit"
                          className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold text-xs shadow-xs"
                        >
                          Transmit Dispense Status to Prescription Module
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}

            {/* VIEW 7: PRESCRIPTION SUBMISSION / HANDOFF */}
            {tab === 'handoff' && selectedRx && (
              <div className="max-w-xl mx-auto py-8 space-y-6 text-center">
                <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-2xl font-bold">
                  ✓
                </div>
                <div>
                  <span className="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200">
                    Handoff Confirmed & Transmitted
                  </span>
                  <h2 className="text-2xl font-bold text-slate-900 mt-2">Prescription Sent to Pharmacy</h2>
                  <p className="text-xs text-slate-500 mt-1">Prescription is now active in Madam Sarah's dispensing queue.</p>
                </div>

                <div className="bg-white p-5 rounded-xl border border-slate-200 text-left text-xs space-y-2 max-w-md mx-auto shadow-xs">
                  <div className="flex justify-between border-b pb-2">
                    <span className="text-slate-500">Prescription Tracking ID:</span>
                    <strong className="font-mono text-teal-800">{selectedRx.prescriptionNumber}</strong>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Patient:</span>
                    <strong>{selectedRx.patientName} ({selectedRx.patientIdentifier})</strong>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Prescribed By:</span>
                    <span>{selectedRx.doctorName}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Initial Status:</span>
                    <Badge status={selectedRx.status} size="sm" />
                  </div>
                </div>

                <div className="flex justify-center gap-3">
                  <button onClick={() => setTab('dashboard')} className="px-4 py-2 border rounded text-xs font-medium hover:bg-slate-50">Dashboard</button>
                  <button onClick={() => setTab('details')} className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded text-xs font-bold">Print / Inspect Rx</button>
                </div>
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="bg-white border-t border-slate-200 py-3 text-center text-[11px] text-slate-500">
            Centralized Clinic Information System (CCIS) • Module 3: Prescription Management
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
